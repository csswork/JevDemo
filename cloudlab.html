<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云的对比</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font: 13px/1.4 -apple-system, 'PingFang SC', sans-serif;
        overflow: hidden;
      }
      #bar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 40px;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 0 12px;
        background: #1c1c1e;
        z-index: 2;
      }
      #bar button {
        background: #333;
        color: #eee;
        border: 0;
        border-radius: 5px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #bar button.on {
        background: #3b6fd8;
      }
      #bar .group {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #view {
        position: fixed;
        inset: 40px 0 0 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .label {
        position: absolute;
        padding: 3px 8px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="view"></div>
    <script type="module" src="/src/dev/cloudLab.ts"></script>
  </body>
</html>
