<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街景 · 新天空预览 · 昼夜预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#eef2f7;font:14px system-ui}canvas{display:block;width:100%;height:100vh;touch-action:none}header{position:absolute;left:28px;top:24px;pointer-events:none;text-shadow:0 2px 18px #162b5580}h1{font-size:26px;letter-spacing:3px;font-weight:500;margin:0 0 6px}header p{margin:0;opacity:.85;font-size:12px}.panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(850px,calc(100% - 32px));background:#101d30bd;backdrop-filter:blur(20px);border:1px solid #ffffff25;border-radius:18px;padding:18px 22px;box-shadow:0 12px 45px #0002}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}button{font:inherit;color:inherit;background:#ffffff0c;border:1px solid #ffffff22;padding:7px 14px;border-radius:8px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#ffffff26}input[type=range]{flex:1;min-width:120px;accent-color:#e5cba3}label{font-size:12px;color:#c5d1e0}output{font-variant-numeric:tabular-nums;font-size:20px;min-width:64px}small{color:#aab9cd;font-size:11px}#status{position:absolute;right:24px;top:28px;font-size:12px;color:#d1dceb}input[type=checkbox]{accent-color:#e5cba3}.minor{gap:20px}.minor label{display:flex;align-items:center;gap:8px;flex:1}.minor input{width:110px;min-width:60px}</style>
<canvas></canvas><header><h1>街景 · 新天空预览</h1><p>街景完整场景 · 新天空 · 独立审阅</p></header><div id="status">正在加载…</div>
<section class="panel"><div class="row"><button id="street-view">沿街视角</button><button id="sea-view">海景视角</button><button id="town-view">对岸建筑</button><button id="plant-view">盆栽细节</button><button id="flower-view">花店细节</button><button id="wide-view">全景视角</button><button id="ocean-view">海面近景</button><button id="shore-view">岸边泡沫</button><button id="glint-view">波光视角</button><button id="toggle-ocean">海洋控制</button><button id="toggle-controls">展开天空控制</button><label><input id="street-visible" type="checkbox" checked>显示街景</label><small id="load-state">载入街景资源…</small></div><div id="ocean-controls" hidden><div class="row"><label><input id="new-ocean" type="checkbox" checked>使用新海洋（关闭对比旧版）</label><select id="ocean-model" aria-label="海洋算法"><option value="fft">双层 FFT</option><option value="analytic">上一版解析波浪</option></select><select id="ocean-resolution" aria-label="波场分辨率"><option value="128">128² 波场</option><option value="256">256² 波场</option></select><select id="ocean-quality" aria-label="海洋质量"><option value="low">节能</option><option value="balanced" selected>均衡</option><option value="high">精细</option></select></div><div class="row minor"><label>波浪 <span id="ocean-waves-value">0.55</span><input aria-label="海洋波浪" id="ocean-waves" type="range" min="0" max="1.5" step=".01" value=".55"></label><label>粗糙度 <span id="ocean-roughness-value">0.28</span><input aria-label="海洋粗糙度" id="ocean-roughness" type="range" min=".08" max=".6" step=".01" value=".28"></label></div><div class="row minor"><label>泡沫 <span id="ocean-foam-value">0.32</span><input aria-label="海洋泡沫" id="ocean-foam" type="range" min="0" max="1" step=".01" value=".32"></label><label>反射 <span id="ocean-reflection-value">0.88</span><input aria-label="海洋反射" id="ocean-reflection" type="range" min="0" max="1" step=".01" value=".88"></label></div><div class="row minor"><label>波光 <span id="ocean-glitter-value">0.60</span><input aria-label="海洋波光" id="ocean-glitter" type="range" min="0" max="2" step=".01" value=".6"></label></div><div class="row"><button id="ocean-validate">验证波场</button><button id="ocean-benchmark">性能对比</button></div><pre id="ocean-report" style="max-height:140px;overflow:auto;font-size:11px;white-space:pre-wrap"></pre><label><input id="ocean-paused" type="checkbox">暂停海浪</label> <small>波光随浪面坡度变化，点“波光视角”转向光源。</small></div><div id="sky-controls" hidden><div class="row"><output id="clock">15:00</output><input aria-label="一天中的时间" id="hour" type="range" min="0" max="23.99" step=".01" value="15"><button id="play" aria-pressed="false">播放一天</button></div><div class="row"><button data-hour="5.5">清晨</button><button data-hour="15">晴日</button><button data-hour="18.8">日落</button><button data-hour="22">星夜</button><label><input id="follow" type="checkbox">追随日月</label></div><div class="row minor"><label>积云云量 <span id="coverage-value">32%</span><input aria-label="积云云量" id="coverage" type="range" min="0" max="1" step=".01" value=".32"></label><label>卷云云量 <span id="cirrus-value">40%</span><input aria-label="卷云云量" id="cirrus" type="range" min="0" max="1" step=".01" value=".4"></label></div><div class="row minor"><label>月相<input aria-label="月相" id="phase" type="range" min="0" max="1" step=".01" value=".5"></label></div><div class="row minor"><label>风向<input aria-label="风向" id="wind-direction" type="range" min="0" max="360" step="1" value="27"></label><label>风速<input aria-label="风速" id="wind-speed" type="range" min="0" max="12" step=".1" value="2"></label><select id="quality" aria-label="渲染质量"><option value="low">节能</option><option value="balanced" selected>均衡</option><option value="high">精细</option></select></div><small id="wind-info"></small><br><small>左键旋转 · 右键平移 · 滚轮缩放 · 仅预览，主应用未替换</small></div></section>
<script type="module" src="./preview.ts"></script></html>
