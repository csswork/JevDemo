<!doctype html><html lang="zh"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夏夏 · 短裙换装预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#d9dfd7;color:#243934;font:14px system-ui}canvas{display:block}aside[hidden]{display:none}#panel-toggle{position:absolute;right:20px;top:15px;z-index:5}aside{position:absolute;top:60px;right:20px;width:290px;padding:22px;border-radius:18px;background:#f9faf4ed;box-shadow:0 8px 30px #142c2620}h1{font-size:19px;margin:0 0 8px}p{color:#65746c;font-size:12px;line-height:1.7}button,select{border:1px solid #ccd5cb;border-radius:7px;background:#fff;padding:9px;color:inherit;font:inherit;cursor:pointer}nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:16px 0}button.active{background:#2a575b;color:white}label{display:flex;align-items:center;gap:8px;margin:13px 0}input[type=range]{width:130px}#stats{font-size:12px;line-height:1.9;border-top:1px solid #dde2d7;padding-top:12px;color:#60746c}#load{position:absolute;left:25px;top:25px}footer{position:absolute;bottom:18px;left:22px;font-size:12px;color:#4c655a;background:#ffffffaa;padding:9px 13px;border-radius:10px}@media(max-width:650px){aside{width:230px;right:10px;top:60px;padding:14px}h1{font-size:16px}}
</style><body><div id="load">正在加载夏夏与 Blender 短裙…</div><button id="panel-toggle">服装控制</button><aside><h1>夏夏 · 玫瑰蕾丝短裙</h1><p>Blender 新建服装 · 独立审核预览<br>拖动旋转，滚轮缩放，右键平移。</p><nav><button data-pose="idle" class="active">站立</button><button data-pose="walk">原地走动</button><button data-pose="turn">转身</button><button data-pose="squat">下蹲</button><button data-pose="squatHold">保持蹲姿检查</button></nav><label>服装 <select id="outfit" aria-label="服装"><option value="new">新蕾丝裙</option><option value="original">原服装对比</option><option value="body">隐藏所有衣物 · 保留身体贴图</option></select></label><p id="inspection-note" hidden>服装网格已隐藏，身体保留原有材质与贴图，包括内衣和丝袜。若出现缺口，表示模型该处没有完整表面。</p><label><input type="checkbox" id="physics" checked> 布料模拟</label><label><input type="checkbox" id="collision" checked> 腿部与骨盆碰撞</label><label><input type="checkbox" id="debug"> 显示碰撞体</label><label>微风 <input aria-label="微风" id="wind" type="range" min="0" max="3" step=".1" value=".8"></label><button id="reset">重置裙摆</button><div id="stats">等待模型</div><p>碰撞采用身体胶囊与地面；本版不含布料自碰撞或椅子碰撞。正式项目待审核后接入。</p></aside><footer>仅 preview · 原角色和正式场景未修改</footer><script type="module" src="./preview.ts"></script></body></html>
