<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云层形变检查</title>
<style>body{margin:0;color:#edf1f7;font:14px system-ui;background:#102033}canvas{display:block;width:100%;height:100vh}header{position:absolute;top:24px;left:28px;text-shadow:0 2px 12px #20334a}h1{font-size:24px;margin:0 0 6px}p{margin:0;color:#d4deeb}.panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 56px));padding:18px;background:#101d30dd;border:1px solid #ffffff25;border-radius:16px}.row{display:flex;align-items:center;gap:14px;margin:8px 0}input[type=range]{flex:1;accent-color:#e5cba3}button{font:inherit;color:inherit;border:1px solid #ffffff30;background:#ffffff10;border-radius:7px;padding:7px 13px}output{min-width:58px;font-variant-numeric:tabular-nums}a{color:#bad8ff}small{color:#b8c7d9}</style></head>
<body><canvas></canvas><header><h1>云层形变检查</h1><p>固定镜头与日光 · 可关闭风验证形变 · 使用街景同一云层组件</p></header>
<section class="panel"><div class="row"><label for="coverage">积云云量</label><input id="coverage" type="range" min="0" max="1" step=".01" value=".32"><output id="amount">32%</output></div>
<div class="row"><label for="age">形变时间</label><input id="age" type="range" min="0" max="300" step="1" value="0"><output id="seconds">0 秒</output></div>
<div class="row"><button id="play">播放形变</button><button id="reset">重置</button><label><input id="wind" type="checkbox">加入风向移动</label><a href="/sky-preview/">返回街景</a></div><small>关闭风时，云的位置不再按风向整体平移，但轮廓、厚度和内部结构仍会逐渐变化。拖动时间条用于加速检查，实时播放使用正常速度。</small></section>
<script type="module" src="./cloud-shape-review.ts"></script></body></html>
