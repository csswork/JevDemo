<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天空实验室 · 昼夜预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#eef2f7;font:14px system-ui}canvas{display:block;width:100%;height:100vh;touch-action:none}header{position:absolute;left:28px;top:24px;pointer-events:none;text-shadow:0 2px 18px #162b5580}h1{font-size:26px;letter-spacing:3px;font-weight:500;margin:0 0 6px}header p{margin:0;opacity:.85;font-size:12px}.panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 32px));background:#101d30bd;backdrop-filter:blur(20px);border:1px solid #ffffff25;border-radius:18px;padding:18px 22px;box-shadow:0 12px 45px #0002}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}button{font:inherit;color:inherit;background:#ffffff0c;border:1px solid #ffffff22;padding:7px 14px;border-radius:8px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#ffffff26}input[type=range]{flex:1;min-width:120px;accent-color:#e5cba3}label{font-size:12px;color:#c5d1e0}output{font-variant-numeric:tabular-nums;font-size:20px;min-width:64px}small{color:#aab9cd;font-size:11px}#status{position:absolute;right:24px;top:28px;font-size:12px;color:#d1dceb}input[type=checkbox]{accent-color:#e5cba3}.minor{gap:20px}.minor label{display:flex;align-items:center;gap:8px;flex:1}.minor input{width:110px;min-width:60px}</style>
<canvas></canvas><header><h1>天空实验室</h1><p>云层 · 日月 · 星河 / 独立实时预览</p></header><div id="status">正在加载…</div>
<section class="panel"><div class="row"><output id="clock">15:00</output><input aria-label="一天中的时间" id="hour" type="range" min="0" max="23.99" step=".01" value="15"><button id="play" aria-pressed="false">播放一天</button></div><div class="row"><button data-hour="5.5">清晨</button><button data-hour="15">晴日</button><button data-hour="18.8">日落</button><button data-hour="22">星夜</button><label><input id="follow" type="checkbox" checked>追随日月</label></div><div class="row minor"><label>积云云量 <span id="coverage-value">32%</span><input aria-label="积云云量" id="coverage" type="range" min="0" max="1" step=".01" value=".32"></label><label>卷云云量 <span id="cirrus-value">40%</span><input aria-label="卷云云量" id="cirrus" type="range" min="0" max="1" step=".01" value=".4"></label></div><div class="row minor"><label>月相<input aria-label="月相" id="phase" type="range" min="0" max="1" step=".01" value=".5"></label></div><div class="row minor"><label>风向<input aria-label="风向" id="wind-direction" type="range" min="0" max="360" step="1" value="27"></label><label>风速<input aria-label="风速" id="wind-speed" type="range" min="0" max="12" step=".1" value="2"></label><select id="quality" aria-label="渲染质量"><option value="low">节能</option><option value="balanced" selected>均衡</option><option value="high">精细</option></select></div><small id="wind-info"></small><br><small>拖动画面环视 · 一天播放约 96 秒 · 太阳时 / 示意月轨 · 尚未接入街景和公园</small></section>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {TimeOfDay} from '/src/vrm/timeOfDay.ts';
import {createSkyRenderer} from './skyRenderer.ts';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(65,1,.1,2000),sky=createSkyRenderer();scene.add(sky.group);const time=new TimeOfDay();time.setMode(15,true);
const windDirection=document.querySelector('#wind-direction'),windSpeed=document.querySelector('#wind-speed'),status=document.querySelector('#status'),windInfo=document.querySelector('#wind-info');
function applyWind(){sky.setWind(Number(windDirection.value),Number(windSpeed.value));windInfo.textContent=`风向 ${windDirection.value}° · 风速 ${Number(windSpeed.value).toFixed(1)} m/s`; }windDirection.oninput=windSpeed.oninput=applyWind;applyWind();
const coverageValue=document.querySelector('#coverage-value'),cirrus=document.querySelector('#cirrus');
function applyCirrus(){sky.setCirrusCoverage(Number(cirrus.value));document.querySelector('#cirrus-value').textContent=Math.round(Number(cirrus.value)*100)+'%';}cirrus.oninput=applyCirrus;applyCirrus();
const hour=document.querySelector('#hour'),phase=document.querySelector('#phase'),coverage=document.querySelector('#coverage'),follow=document.querySelector('#follow'),play=document.querySelector('#play'),clock=document.querySelector('#clock');let playing=false,yaw=0,pitch=.4,last=performance.now(),drag=null,frameId=0,lastMotionStamp=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
coverage.oninput=()=>coverageValue.textContent=Math.round(Number(coverage.value)*100)+'%';
function setHour(h){hour.value=h;time.setMode(Number(h),true)}hour.oninput=()=>{playing=false;play.setAttribute('aria-pressed','false');play.textContent='播放一天';setHour(hour.value)};
for(const b of document.querySelectorAll('[data-hour]'))b.onclick=()=>{playing=false;play.setAttribute('aria-pressed','false');play.textContent='播放一天';follow.checked=true;setHour(b.dataset.hour)};
document.querySelector('#quality').onchange=e=>sky.setQuality(e.target.value);
play.onclick=()=>{playing=!playing;play.setAttribute('aria-pressed',String(playing));play.textContent=playing?'暂停':'播放一天'};
canvas.onpointerdown=e=>{follow.checked=false;drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.004;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag[1])*.003,-.06,1.5);drag=[e.clientX,e.clientY]};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
function frame(now){const dt=Math.min((now-last)/1000,.1);last=now;if(playing)setHour((Number(hour.value)+dt*.25)%24);time.update(dt);sky.update(time.state,dt,camera,Number(coverage.value),Number(phase.value));if(follow.checked){const d=time.state.sunElev>-3?sky.sunDir:sky.moonDir;yaw=Math.atan2(d.z,d.x);pitch=THREE.MathUtils.clamp(Math.asin(d.y),.12,1.16)}camera.lookAt(Math.cos(yaw)*Math.cos(pitch),Math.sin(pitch),Math.sin(yaw)*Math.cos(pitch));sky.renderClouds(renderer,camera);renderer.render(scene,camera);const h=Number(hour.value);clock.value=String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');const label=time.state.sunElev>-3?'日光 · 云影':'夜空 · 星光';if(status.textContent!==label)status.textContent=label;if(!status.dataset.ready)status.dataset.ready='true';if(now-lastMotionStamp>250){status.dataset.windX=sky.windOffset.x.toFixed(3);status.dataset.windZ=sky.windOffset.y.toFixed(3);lastMotionStamp=now;}frameId=requestAnimationFrame(frame)}frameId=requestAnimationFrame(frame);
addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);sky.dispose();renderer.dispose()},{once:true});
</script></html>
