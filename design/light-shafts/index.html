<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林间光 · 丁达尔着色器</title>
<style>body{margin:0;background:#adbc9d;font:13px system-ui;color:#f2f1e9}canvas{display:block}aside{position:fixed;right:18px;top:18px;bottom:18px;width:238px;overflow:auto;padding:18px;background:#29362bdf;border:1px solid #ffffff24;border-radius:14px;backdrop-filter:blur(12px)}h1{font-size:17px;font-weight:500;margin:0 0 6px}p{opacity:.7;font-size:12px;line-height:1.5}button{font:inherit;color:inherit;padding:7px 9px;margin:3px 0;background:#ffffff0c;border:1px solid #ffffff28;border-radius:7px}label{display:block;margin:12px 0}label span{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#dbc38e}input[type=color]{height:24px;vertical-align:middle}#stats{opacity:.65;font-size:11px}pre{white-space:pre-wrap;font-size:11px}nav{position:fixed;left:18px;bottom:18px;background:#29362bcc;padding:8px;border-radius:10px}@media(max-width:600px){aside{width:auto;font-size:12px;left:8px;right:8px;top:auto;bottom:64px;max-height:42vh;padding:12px}nav{left:8px;bottom:8px}}fieldset{border:0;padding:0;margin:0;min-width:0}fieldset:disabled{opacity:.45}#mode-hint{line-height:1.65}select{max-width:100%}</style>
<aside><h1>林间光</h1><p>阴影驱动体积光 · three-good-godrays · 仅预览</p><label>对比模式 <select id="mode" aria-label="对比模式"><option value="volume">树叶遮挡体积光</option><option value="legacy">原光束面片</option><option value="off">关闭光束</option></select></label><fieldset id="volume-controls"><p id="mode-hint">参数作用于树叶遮挡体积光。密度为 0 时无散射；散射上限只限制过亮区域。</p><label>计算分辨率 <select id="quality" aria-label="计算分辨率"><option value="0.25">1/4 · 节能</option><option value="0.5" selected>1/2 · 均衡</option><option value="1">原分辨率 · 精细</option></select></label><button id="natural">林间日光</button> <button id="mist">薄雾柔光</button> <button id="rays">清晰光隙</button><label><span>太阳高度<output id="sunElevation-value">35°</output></span><input id="sunElevation" aria-label="太阳高度" type="range" min="10" max="70" step="1" value="35"></label><div id="parameters"></div><label>光色 <input id="color" aria-label="光色" type="color" value="#fff6e3"></label></fieldset><p id="stats"></p><details><summary>复用参数</summary><pre id="config"></pre></details></aside>
<nav><button id="toggle">调节光束</button> <button id="sunlight">逆光观察</button> <button id="deck">栈道全景</button> <button id="furniture">桌凳近景</button> <button id="bench">林间长椅</button></nav><script type="module" src="./preview.ts"></script></html>
